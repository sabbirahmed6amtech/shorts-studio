<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Shorts Studio</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">▶</span>Shorts Studio</a>
    <nav><a href="/">Videos</a><a href="/schedule.html">Schedule</a><a href="/settings.html" class="active">Settings</a></nav>
  </header>

  <main class="page">
    <section class="card" id="yt-card">
      <h2>YouTube channel</h2>
      <div class="notice err small hidden" id="yt-msg"></div>
      <div id="yt-body" class="muted">Checking…</div>
    </section>

    <form id="form" class="page" style="padding:0">
      <section class="card">
        <h2>Gemini</h2>
        <div class="form-grid">
          <label class="full">API key
            <input type="password" name="gemini_api_key" autocomplete="off" placeholder="Paste your key">
            <span class="hint" id="key-hint">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. On the free tier Google may use what you send to improve its models, so don't use it for client videos you can't share.</span>
          </label>
          <label>Model
            <input type="text" name="gemini_model" list="models" required>
            <datalist id="models">
              <option value="gemini-3.8-flash">
              <option value="gemini-3.5-flash-lite">
            </datalist>
            <span class="hint">If Gemini says the model was not found, check the current names on Google's model list.</span>
          </label>
          <label>Backup model
            <input type="text" name="gemini_fallback_model" list="models" placeholder="None">
            <span class="hint">Used automatically when the main model is overloaded ("high demand").</span>
          </label>
          <label>Style of clips (optional)
            <input type="text" name="tone" placeholder="e.g. educational, funny, motivational">
            <span class="hint">Extra guidance for Gemini when it picks clips.</span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Clips</h2>
        <div class="form-grid">
          <label>Shortest clip (seconds)<input type="number" name="clip_min" min="5" max="170" required></label>
          <label>Longest clip (seconds)<input type="number" name="clip_max" min="10" max="180" required>
            <span class="hint">YouTube Shorts can be up to 3 minutes.</span></label>
          <label>Clips per video<input type="number" name="clip_count" min="1" max="30" required></label>
          <label>Minimum score<input type="number" name="min_score" min="0" max="100" required>
            <span class="hint">Hide Gemini's suggestions below this score.</span></label>
          <label class="full">Default hashtags
            <input type="text" name="default_hashtags" placeholder="#shorts">
            <span class="hint">Added to every clip, separated by spaces.</span></label>
        </div>
      </section>

      <section class="card">
        <h2>Captions</h2>
        <div class="form-grid">
          <label class="check-label full"><input type="checkbox" name="captions_enabled"> Burn word-by-word captions into the video</label>
          <div class="cap-preview full" id="cap-preview" aria-hidden="true"><span>THIS IS <b>HOW</b> IT LOOKS</span></div>
          <label>Font
            <select name="caption_font">
              <option value="Anton">Anton</option>
              <option value="Poppins ExtraBold">Poppins ExtraBold</option>
              <option value="Bebas Neue">Bebas Neue</option>
            </select>
            <span class="hint">Add more .ttf files to the fonts folder and type the font's name in a later version.</span>
          </label>
          <label>Text size<input type="number" name="caption_size" min="30" max="200" required>
            <span class="hint">Pixels on the 1080×1920 video.</span></label>
          <label>Words on screen at once<input type="number" name="caption_words" min="1" max="6" required></label>
          <label>Height from bottom (%)<input type="number" name="caption_position" min="2" max="90" required>
            <span class="hint">30 sits above YouTube's buttons and title.</span></label>
          <label>Text colour<input type="color" name="caption_color"></label>
          <label>Spoken word colour<input type="color" name="caption_highlight"></label>
          <label class="check-label"><input type="checkbox" name="caption_uppercase"> UPPERCASE</label>
        </div>
      </section>

      <section class="card">
        <h2>Publishing</h2>
        <div class="form-grid">
          <label>Default publish time<input type="time" name="yt_publish_time" required>
            <span class="hint">In this computer's time zone. "Schedule all" uses one slot per clip.</span></label>
          <label>Hours between Shorts<input type="number" name="yt_gap_hours" min="1" max="720" required>
            <span class="hint">24 = one a day. YouTube's default API quota allows about 6 uploads a day.</span></label>
          <label>Category
            <select name="yt_category">
              <option value="1">Film &amp; Animation</option><option value="2">Autos &amp; Vehicles</option>
              <option value="10">Music</option><option value="15">Pets &amp; Animals</option>
              <option value="17">Sports</option><option value="19">Travel &amp; Events</option>
              <option value="20">Gaming</option><option value="22">People &amp; Blogs</option>
              <option value="23">Comedy</option><option value="24">Entertainment</option>
              <option value="25">News &amp; Politics</option><option value="26">Howto &amp; Style</option>
              <option value="27">Education</option><option value="28">Science &amp; Technology</option>
            </select>
          </label>
          <label>"Upload now" visibility
            <select name="yt_now_privacy">
              <option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option>
            </select>
          </label>
          <label class="check-label full"><input type="checkbox" name="yt_made_for_kids"> These videos are made for kids</label>
        </div>
      </section>

      <section class="card">
        <h2>Transcription</h2>
        <div class="form-grid">
          <label class="full">Transcript source
            <select name="transcript_source">
              <option value="auto">Auto: YouTube captions when available, otherwise Whisper (recommended)</option>
              <option value="youtube">YouTube captions only: fastest, never runs Whisper</option>
              <option value="whisper">Whisper only: most accurate, slowest</option>
              <option value="none">No transcript: loudness only (gameplay without talking)</option>
            </select>
            <span class="hint">YouTube captions take seconds instead of minutes. Auto-generated ones include word timing, so captions stay in sync. Uploaded files always use Whisper (or nothing). Applies to new videos.</span>
          </label>
          <label class="check-label full"><input type="checkbox" name="loudness_hints"> Loudness hints: tell Gemini where the audio gets loud, including stretches with no speech</label>
          <span class="hint full" style="margin-top:-10px">Helps with streams and gaming, where the best moments are reactions and action rather than talking.</span>
          <label class="check-label full"><input type="checkbox" name="whisper_fast"> Faster Whisper: about twice as fast, slightly less accurate</label>
          <label>Whisper model
            <select name="whisper_model">
              <option value="tiny">tiny: fastest, least accurate</option>
              <option value="base">base</option>
              <option value="small">small: good balance (recommended)</option>
              <option value="medium">medium: slower, more accurate</option>
              <option value="large-v3-turbo">large-v3-turbo: best, needs a GPU to be quick</option>
            </select>
            <span class="hint">Downloaded once, the first time you use it.</span>
          </label>
          <label>Run on
            <select name="whisper_device">
              <option value="cpu">CPU (works everywhere)</option>
              <option value="cuda">NVIDIA GPU (needs CUDA installed)</option>
              <option value="mps">Apple GPU (Mac, experimental)</option>
            </select>
          </label>
          <label>Language
            <input type="text" name="language" placeholder="Auto-detect">
            <span class="hint">Leave blank to detect, or a code like en, hi, bn.</span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Advanced</h2>
        <div class="form-grid">
          <label class="full">ffmpeg location
            <input type="text" name="ffmpeg_path" placeholder="Auto-detect">
            <span class="hint">Only if the app can't find ffmpeg: the folder that contains it, or the ffmpeg file itself.</span>
          </label>
        </div>
      </section>

      <div class="row">
        <button class="btn primary" type="submit">Save settings</button>
        <span class="saved" id="saved">Saved</span>
      </div>
    </form>
  </main>

  <script type="module" src="/settings.js"></script>
</body>
</html>
